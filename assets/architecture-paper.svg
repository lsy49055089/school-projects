<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Parallel Decision Tree Architecture</title>
  <desc id="desc">I-Memory and AD-Memory feed three Universal Nodes in parallel. UN1 evaluates the current node, UN2 the left child, and UN3 the right child. Decision Logic selects the next node or class and feeds the next node address back to AD-Memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#12395b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#1677c8"/>
    </marker>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif}
      .title{font-size:42px;font-weight:800;fill:#10355b}
      .sub{font-size:22px;font-weight:500;fill:#516b84}
      .head{font-size:27px;font-weight:800;fill:#0f3358}
      .body{font-size:17px;font-weight:500;fill:#395873}
      .small{font-size:15px;font-weight:600;fill:#526d86}
      .label{font-size:17px;font-weight:700;fill:#155b9d}
      .line{fill:none;stroke:#1677c8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .dash{fill:none;stroke:#70aede;stroke-width:3;stroke-dasharray:8 8;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1600" height="860" rx="30" fill="url(#bg)"/>

  <g class="t">
    <rect x="48" y="35" width="10" height="105" rx="5" fill="#0866b3"/>
    <text x="92" y="84" class="title">Parallel Decision Tree Architecture</text>
    <text x="92" y="124" class="sub">Current node, left child, and right child are evaluated in parallel</text>

    <g filter="url(#shadow)">
      <rect x="1040" y="32" width="500" height="124" rx="18" fill="#eaf5ff" stroke="#b9dcf8" stroke-width="2"/>
    </g>
    <circle cx="1076" cy="66" r="5" fill="#10355b"/><text x="1096" y="72" class="body">3 Universal Nodes run in parallel</text>
    <circle cx="1076" cy="101" r="5" fill="#10355b"/><text x="1096" y="107" class="body">Left / right child results are computed speculatively</text>
    <circle cx="1076" cy="136" r="5" fill="#10355b"/><text x="1096" y="142" class="body">Decision Logic selects the next node or leaf class</text>

    <g filter="url(#shadow)">
      <rect x="58" y="278" width="250" height="122" rx="20" fill="#f7fbff" stroke="#6fa8df" stroke-width="2.5"/>
      <text x="183" y="326" text-anchor="middle" class="head">I-Memory</text>
      <text x="183" y="360" text-anchor="middle" class="body">shared input vector</text>

      <rect x="58" y="486" width="250" height="122" rx="20" fill="#f7fbff" stroke="#6fa8df" stroke-width="2.5"/>
      <text x="183" y="534" text-anchor="middle" class="head">AD-Memory</text>
      <text x="183" y="568" text-anchor="middle" class="body">current / child address</text>
    </g>

    <rect x="470" y="195" width="690" height="510" rx="24" fill="#f8fcff" stroke="#8fc8f4" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="815" y="235" text-anchor="middle" class="head" fill="#1677c8">3 Universal Nodes — Parallel Evaluation</text>

    <!-- two clean input rails -->
    <path d="M308 339H395V642" class="dash"/>
    <path d="M308 547H438V642" class="line"/>
    <text x="327" y="323" class="small">input vector</text>
    <text x="327" y="532" class="small">node address</text>

    <!-- UN1 -->
    <g filter="url(#shadow)">
      <rect x="505" y="270" width="360" height="112" rx="18" fill="#fff5f4" stroke="#e6968e" stroke-width="2.5"/>
      <text x="535" y="313" class="head">UN1</text>
      <text x="635" y="313" class="body">Current Node</text>
      <text x="535" y="350" class="small">feature / threshold comparison</text>
    </g>
    <path d="M395 306H505" class="dash" marker-end="url(#arrow)"/>
    <path d="M438 350H505" class="line" marker-end="url(#arrow)"/>

    <!-- UN2 -->
    <g filter="url(#shadow)">
      <rect x="505" y="423" width="360" height="112" rx="18" fill="#f2fbf4" stroke="#80c796" stroke-width="2.5"/>
      <text x="535" y="466" class="head">UN2</text>
      <text x="635" y="466" class="body">Left Child</text>
      <text x="535" y="503" class="small">speculative child comparison</text>
    </g>
    <path d="M395 459H505" class="dash" marker-end="url(#arrow)"/>
    <path d="M438 503H505" class="line" marker-end="url(#arrow)"/>

    <!-- UN3 -->
    <g filter="url(#shadow)">
      <rect x="505" y="576" width="360" height="112" rx="18" fill="#f3f7ff" stroke="#79a9ec" stroke-width="2.5"/>
      <text x="535" y="619" class="head">UN3</text>
      <text x="635" y="619" class="body">Right Child</text>
      <text x="535" y="656" class="small">speculative child comparison</text>
    </g>
    <path d="M395 612H505" class="dash" marker-end="url(#arrow)"/>
    <path d="M438 656H505" class="line" marker-end="url(#arrow)"/>

    <!-- Decision Logic -->
    <g filter="url(#shadow)">
      <rect x="930" y="337" width="190" height="282" rx="20" fill="#fff9e8" stroke="#e7bd55" stroke-width="2.5"/>
      <text x="1025" y="420" text-anchor="middle" class="head">Decision</text>
      <text x="1025" y="455" text-anchor="middle" class="head">Logic</text>
      <text x="1025" y="505" text-anchor="middle" class="small">branch result</text>
      <text x="1025" y="530" text-anchor="middle" class="small">+ child result</text>
      <text x="1025" y="570" text-anchor="middle" class="small">next node / leaf</text>
    </g>

    <!-- distinct outputs, no crossings -->
    <path d="M865 326H900V390H930" class="line" marker-end="url(#arrow)"/>
    <text x="873" y="311" class="small">current result</text>
    <path d="M865 479H930" class="line" marker-end="url(#arrow)"/>
    <text x="873" y="464" class="small">left result</text>
    <path d="M865 632H900V566H930" class="line" marker-end="url(#arrow)"/>
    <text x="873" y="654" class="small">right result</text>

    <!-- output -->
    <g filter="url(#shadow)">
      <rect x="1232" y="398" width="300" height="150" rx="20" fill="#f7fbff" stroke="#6fa8df" stroke-width="2.5"/>
      <text x="1382" y="449" text-anchor="middle" class="head">Next Node / Class</text>
      <text x="1382" y="489" text-anchor="middle" class="body">next node address</text>
      <text x="1382" y="518" text-anchor="middle" class="body">or leaf class</text>
    </g>
    <path d="M1120 478H1232" class="line" marker-end="url(#arrow)"/>

    <!-- feedback routed only along bottom -->
    <path d="M1382 548V770H183V608" class="line" marker-end="url(#arrow)"/>
    <text x="790" y="805" text-anchor="middle" class="label">next node address feedback</text>
  </g>
</svg>